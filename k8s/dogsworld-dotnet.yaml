apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogsworld-dotnet
  namespace: dogsworld
  labels:
    app: dogsworld-dotnet
    tags.datadoghq.com/env: dev
    tags.datadoghq.com/service: dogsworld-dotnet
    tags.datadoghq.com/version: "1.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dogsworld-dotnet
  template:
    metadata:
      labels:
        app: dogsworld-dotnet
        tags.datadoghq.com/env: dev
        tags.datadoghq.com/service: dogsworld-dotnet
        tags.datadoghq.com/version: "1.2"
    spec:
      containers:
        - name: dogsworld-dotnet
          image: ghcr.io/bongcoy/dogsworld-dotnet:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: ConnectionStrings__DogsWorldContext
              value: "Host=postgres;Port=5432;Database=dogs;Username=dogsworld;Password=$(DB_PASSWORD)"
            - name: DD_TRACE_SAMPLING_RULES
              value: '[{"sample_rate":1}]'
            - name: DD_DBM_PROPAGATION_MODE
              value: "full"
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dogsworld-dotnet
  namespace: dogsworld
spec:
  selector:
    app: dogsworld-dotnet
  ports:
    - port: 80
      targetPort: 8080
