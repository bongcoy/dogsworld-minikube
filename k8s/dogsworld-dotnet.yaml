apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogsworld-dotnet
  namespace: dogsworld
  labels:
    app: dogsworld-dotnet
    tags.datadoghq.com/env: dev
    tags.datadoghq.com/service: dogsworld-dotnet
    tags.datadoghq.com/version: "1.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dogsworld-dotnet
  template:
    metadata:
      labels:
        app: dogsworld-dotnet
        tags.datadoghq.com/env: dev
        tags.datadoghq.com/service: dogsworld-dotnet
        tags.datadoghq.com/version: "1.1"
    spec:
      containers:
        - name: dogsworld-dotnet
          image: localhost/dogsworld-dotnet:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: sa-password
            - name: ConnectionStrings__DogsWorldContext
              value: "Server=sqlserver,1433;Database=Dogs;User Id=sa;Password=$(SA_PASSWORD);MultipleActiveResultSets=true;"
            - name: DD_TRACE_SAMPLING_RULES
              value: '[{"sample_rate":1}]'
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dogsworld-dotnet
  namespace: dogsworld
spec:
  selector:
    app: dogsworld-dotnet
  ports:
    - port: 80
      targetPort: 8080
