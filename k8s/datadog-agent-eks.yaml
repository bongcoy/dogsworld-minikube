apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: dogsworld-eks
    site: ap1.datadoghq.com
    tags:
      - "env:staging"
      - "team:bongcoy"
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
