apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: dogsworld
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        admission.datadoghq.com/enabled: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sqlcmd
          image: mcr.microsoft.com/mssql-tools
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: sa-password
          command: ["/bin/bash", "-c"]
          args:
            - |
              /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$SA_PASSWORD" -b -Q "
              IF DB_ID('Dogs') IS NULL CREATE DATABASE Dogs;"
              /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$SA_PASSWORD" -d Dogs -b -Q "
              IF OBJECT_ID('dbo.Dog') IS NULL
              BEGIN
                CREATE TABLE dbo.Dog (
                  Id INT IDENTITY(1,1) NOT NULL CONSTRAINT PK_Dog PRIMARY KEY,
                  Name NVARCHAR(MAX) NULL,
                  Breed NVARCHAR(MAX) NULL,
                  Age INT NOT NULL,
                  BirthDate DATETIME2 NOT NULL,
                  HasOwner BIT NOT NULL
                );
                INSERT INTO dbo.Dog (Name, Breed, Age, BirthDate, HasOwner) VALUES
                  ('Buddy', 'Golden Retriever', 3, '2023-01-15', 1),
                  ('Luna', 'Husky', 2, '2024-03-10', 1),
                  ('Max', 'Beagle', 5, '2021-07-22', 0);
              END"
