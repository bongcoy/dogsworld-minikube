apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: dogsworld-eks
    site: ap1.datadoghq.com
    tags:
      - "env:staging"
      - "team:bongcoy"
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    secretBackend:
      type: "k8s.secrets"
  override:
    nodeAgent:
      extraConfd:
        configDataMap:
          postgres.yaml: |-
            ad_identifiers:
              - postgres
            init_config:
            instances:
              - dbm: true
                host: "%%host%%"
                port: 5432
                username: datadog
                password: "ENC[dogsworld/datadog-pg-secret;password]"
  features:
    apm:
      instrumentation:
        enabled: true
        targets:
          - name: dogsworld
            namespaceSelector:
              matchNames:
                - dogsworld
            ddTraceVersions:
              dotnet: "3"
              js: "5"
