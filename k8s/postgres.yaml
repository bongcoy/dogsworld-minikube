# Secret "postgres-secret" (key: password) dibuat lewat kubectl, bukan lewat file ini.
# init.sql hanya dijalankan image postgres saat volume masih kosong (pertama kali).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: dogsworld
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS "Dog" (
      "Id" integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      "Name" text NULL,
      "Breed" text NULL,
      "Age" integer NOT NULL,
      "BirthDate" timestamp NOT NULL,
      "HasOwner" boolean NOT NULL
    );

    INSERT INTO "Dog" ("Id", "Name", "Breed", "Age", "BirthDate", "HasOwner") VALUES
      (1, 'Buddy', 'Golden Retriever', 3, '2023-01-15 00:00:00', true),
      (2, 'Luna', 'Husky', 2, '2024-03-10 00:00:00', true),
      (3, 'Max', 'Beagle', 5, '2021-07-22 00:00:00', false),
      (4, 'anjing A', 'Cihuahua', 18, '2026-10-21 09:12:23.228', true),
      (5, 'anjing A', 'Cihuahua', 18, '2026-10-21 09:12:23.228', true),
      (6, 'anjing B', 'Cihuahua', 18, '2026-10-21 09:12:23.228', true),
      (7, 'anjing B', 'Cihuahua', 18, '2026-10-21 09:12:23.228', true),
      (8, 'anjing C', 'Cihuahua', 18, '2026-10-21 09:12:23.228', true),
      (9, 'anjing X', 'Cihuahua', 18, '2026-10-21 09:12:23.228', true);

    SELECT setval(pg_get_serial_sequence('"Dog"', 'Id'), 12);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: dogsworld
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dogsworld
  labels:
    tags.datadoghq.com/env: dev
    tags.datadoghq.com/service: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tags.datadoghq.com/env: dev
        tags.datadoghq.com/service: postgres
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args:
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "track_activity_query_size=4096"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: dogsworld
            - name: POSTGRES_DB
              value: dogs
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dogsworld", "-d", "dogs"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dogsworld
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
